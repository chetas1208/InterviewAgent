[project]
name = "hypersmell"
version = "0.1.0"
description = "Scent memory platform for fragrance professionals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "inngest>=0.4.0",
    "boto3>=1.35.0",
    "sentence-transformers>=3.0.0",
    "pydantic-settings>=2.5.0",
    "loguru>=0.7.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008", "N806"]  # B008: FastAPI Depends() pattern; N806: Mock variable naming

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
