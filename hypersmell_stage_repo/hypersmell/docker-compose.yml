services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hypersmell:hypersmell@postgres:5432/hypersmell
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: hypersmell
      SUPPLIER_CATALOG_API_URL: http://supplier-catalog-api:8001
      TASTING_NOTES_API_URL: http://tasting-notes-api:8002
      MANGO_URL: http://mango:3000
      MANGO_FALLBACK_TOKENS: '{"tasting_notes_conn_001": "test-token-tasting-notes"}'
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      INNGEST_EVENT_KEY: local
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build: .
    command: uvicorn hypersmell.main:app --host 0.0.0.0 --port 8001
    environment:
      DATABASE_URL: postgresql://hypersmell:hypersmell@postgres:5432/hypersmell
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: hypersmell
      SUPPLIER_CATALOG_API_URL: http://supplier-catalog-api:8001
      TASTING_NOTES_API_URL: http://tasting-notes-api:8002
      MANGO_URL: http://mango:3000
      MANGO_FALLBACK_TOKENS: '{"tasting_notes_conn_001": "test-token-tasting-notes"}'
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      INNGEST_EVENT_KEY: local
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hypersmell
      POSTGRES_PASSWORD: hypersmell
      POSTGRES_DB: hypersmell
    volumes:
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  inngest:
    image: inngest/inngest
    ports:
      - "8288:8288"
    command: inngest dev -u http://api:8000/api/inngest

  supplier-catalog-api:
    build: ./mock_apis/supplier_catalog/
    ports:
      - "8001:8001"

  tasting-notes-api:
    build: ./mock_apis/tasting_notes/
    ports:
      - "8002:8002"

